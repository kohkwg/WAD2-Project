<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff9ef">
    <script>
      // Apply the saved/system scheme before styles arrive to avoid a light flash.
      try {
        const saved = localStorage.getItem('bookedz-color-theme')
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.bsTheme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141b22' : '#fff8ec'
      } catch {}
    </script>
    <meta name="description" content="Discover your next experience across Singapore. Explore events, make plans and bring people together with Bookedz.">
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/bookedz-mark.svg">
    <title>Bookedz</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
